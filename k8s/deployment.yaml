apiVersion: apps/v1
kind: Deployment

metadata:
  name: urllc-robot-controller
  namespace: open5gs
  labels:
    app: urllc-robot-controller

spec:
  replicas: 1

  # Karena image masih local pada node riset-5g
  # dan controller hanya perlu satu instance.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: urllc-robot-controller

  template:
    metadata:
      labels:
        app: urllc-robot-controller

    spec:
      # Pin khusus ke RAN1.
      # Jangan pakai workload=ran-mec saja karena angkutin
      # juga punya label tersebut.
      nodeSelector:
        kubernetes.io/hostname: riset-5g

      terminationGracePeriodSeconds: 10

      containers:
        - name: controller

          image: docker.io/library/urllc-robot-controller:v4
          imagePullPolicy: Never

          env:
            # Token autentikasi UE Discovery Agent
            - name: UE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: urllc-robot-controller-secret
                  key: agent-token

            # Agent dianggap stale setelah 35 detik
            - name: AGENT_STALE_SECONDS
              value: "35"

            - name: COMMAND_WAIT_SECONDS
              value: "8"

            - name: LONG_POLL_SECONDS
              value: "25"

            - name: PROXY_WAIT_SECONDS
              value: "25"

            - name: MAX_PROXY_IMAGE_BYTES
              value: "3000000"

            # URLLC/Core test target
            - name: CORE_ACK_TARGET
              value: "172.16.46.1"

            # Robot pada MEC RAN1
            - name: MEC_ROBOT_URL
              value: "http://172.16.49.1:5001/urllc/move"

            # Robot Cloud melalui Cloudflare
            - name: CLOUD_ROBOT_URL
              value: "https://awsub.dpdns.org/urllc/move"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi