apiVersion: v1
kind: Service

metadata:
  name: urllc-robot-controller
  namespace: open5gs

spec:
  type: NodePort

  selector:
    app: urllc-robot-controller

  ports:
    - name: http
      protocol: TCP

      # Internal Kubernetes Service
      port: 8080

      # Container port controller
      targetPort: http

      # External access dari UE Discovery Agent
      nodePort: 30800